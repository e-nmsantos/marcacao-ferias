<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#e9eef7"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 38px 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #64748b; }
      .nav { font: 600 18px 'Segoe UI', sans-serif; fill: #cbd5e1; }
      .navSmall { font: 500 14px 'Segoe UI', sans-serif; fill: #94a3b8; }
      .section { font: 700 22px 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 600 14px 'Segoe UI', sans-serif; fill: #475569; }
      .value { font: 700 24px 'Segoe UI', sans-serif; fill: #0f172a; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #64748b; }
      .badgeText { font: 700 12px 'Segoe UI', sans-serif; fill: #0f172a; }
      .btnText { font: 700 16px 'Segoe UI', sans-serif; fill: #ffffff; }
      .btnTextDark { font: 700 16px 'Segoe UI', sans-serif; fill: #334155; }
      .calendarDay { font: 700 15px 'Segoe UI', sans-serif; fill: #0f172a; }
      .calendarMuted { font: 600 12px 'Segoe UI', sans-serif; fill: #94a3b8; }
      .cardTitle { font: 700 16px 'Segoe UI', sans-serif; fill: #0f172a; }
      .cardMeta { font: 500 13px 'Segoe UI', sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1410" cy="120" r="130" fill="#dbeafe" opacity="0.55"/>
  <circle cx="1240" cy="910" r="160" fill="#e2e8f0" opacity="0.65"/>

  <!-- Sidebar -->
  <rect x="40" y="40" width="260" height="920" rx="28" fill="url(#sidebar)" filter="url(#shadow)"/>
  <text x="78" y="96" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#ffffff">📅 Gestão de Férias</text>
  <text x="78" y="132" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">Versão conceito</text>

  <rect x="70" y="180" width="200" height="52" rx="16" fill="url(#active)"/>
  <text x="98" y="213" class="nav">Calendário</text>

  <text x="98" y="278" class="nav">Pedidos</text>
  <text x="98" y="342" class="nav">Relatórios</text>
  <text x="98" y="406" class="nav">Pessoal</text>
  <text x="98" y="470" class="nav">Logins</text>
  <text x="98" y="534" class="nav">Backup</text>

  <rect x="70" y="620" width="200" height="128" rx="20" fill="#1e293b"/>
  <text x="92" y="655" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Resumo rápido</text>
  <text x="92" y="686" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#ffffff">12</text>
  <text x="130" y="686" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">pedidos pendentes</text>
  <text x="92" y="720" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">3 conflitos este mês</text>

  <rect x="70" y="782" width="200" height="128" rx="20" fill="#0b1220" stroke="#1f2937"/>
  <text x="92" y="818" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Acesso rápido</text>
  <text x="92" y="850" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#ffffff">+ Novo pedido</text>
  <text x="92" y="880" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#ffffff">↻ Atualizar</text>

  <!-- Main shell -->
  <rect x="330" y="40" width="1230" height="920" rx="30" fill="rgba(255,255,255,0.72)" filter="url(#shadow)"/>

  <!-- Top bar -->
  <text x="370" y="98" class="title">Calendário e pedidos</text>
  <text x="370" y="130" class="subtitle">Uma experiência mais premium, com navegação clara e foco nas ações principais.</text>

  <rect x="1190" y="70" width="290" height="56" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="1215" y="104" class="small">Município: Lisboa</text>
  <text x="1410" y="104" class="small">▾</text>

  <!-- KPI cards -->
  <g filter="url(#shadowSoft)">
    <rect x="370" y="170" width="250" height="120" rx="22" fill="#ffffff"/>
    <rect x="640" y="170" width="250" height="120" rx="22" fill="#ffffff"/>
    <rect x="910" y="170" width="250" height="120" rx="22" fill="#ffffff"/>
    <rect x="1180" y="170" width="250" height="120" rx="22" fill="#ffffff"/>
  </g>
  <text x="394" y="206" class="label">Pedidos pendentes</text>
  <text x="394" y="245" class="value">12</text>
  <text x="664" y="206" class="label">Aprovados</text>
  <text x="664" y="245" class="value">38</text>
  <text x="934" y="206" class="label">Hoje ausentes</text>
  <text x="934" y="245" class="value">6</text>
  <text x="1204" y="206" class="label">Conflitos</text>
  <text x="1204" y="245" class="value">3</text>

  <!-- Calendar card -->
  <g filter="url(#shadowSoft)">
    <rect x="370" y="320" width="770" height="600" rx="26" fill="#ffffff"/>
  </g>
  <text x="400" y="364" class="section">Maio 2026</text>
  <text x="980" y="364" class="small">◀  Hoje  ▶</text>

  <!-- Week row -->
  <g>
    <text x="400" y="410" class="calendarMuted">Seg</text>
    <text x="505" y="410" class="calendarMuted">Ter</text>
    <text x="610" y="410" class="calendarMuted">Qua</text>
    <text x="715" y="410" class="calendarMuted">Qui</text>
    <text x="820" y="410" class="calendarMuted">Sex</text>
    <text x="925" y="410" class="calendarMuted">Sáb</text>
    <text x="1030" y="410" class="calendarMuted">Dom</text>
  </g>

  <!-- Calendar cells -->
  <g>
    <rect x="390" y="430" width="90" height="74" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="410" y="463" class="calendarDay">5</text>
    <text x="410" y="492" class="small">Hoje</text>

    <rect x="495" y="430" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="515" y="463" class="calendarDay">6</text>

    <rect x="600" y="430" width="90" height="74" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="620" y="463" class="calendarDay">7</text>
    <text x="620" y="492" class="small">Pedido</text>

    <rect x="705" y="430" width="90" height="74" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="725" y="463" class="calendarDay">8</text>
    <text x="725" y="492" class="small">Feriado</text>

    <rect x="810" y="430" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="830" y="463" class="calendarDay">9</text>

    <rect x="915" y="430" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="935" y="463" class="calendarDay">10</text>

    <rect x="1020" y="430" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1040" y="463" class="calendarDay">11</text>

    <rect x="390" y="520" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="410" y="553" class="calendarDay">12</text>

    <rect x="495" y="520" width="90" height="74" rx="16" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="515" y="553" class="calendarDay">13</text>
    <text x="515" y="582" class="small">Tolerância</text>

    <rect x="600" y="520" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="620" y="553" class="calendarDay">14</text>

    <rect x="705" y="520" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="725" y="553" class="calendarDay">15</text>

    <rect x="810" y="520" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="830" y="553" class="calendarDay">16</text>

    <rect x="915" y="520" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="935" y="553" class="calendarDay">17</text>

    <rect x="1020" y="520" width="90" height="74" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1040" y="553" class="calendarDay">18</text>
  </g>

  <!-- Request card -->
  <g filter="url(#shadowSoft)">
    <rect x="1180" y="320" width="250" height="600" rx="26" fill="#ffffff"/>
  </g>
  <text x="1210" y="364" class="section">Novo pedido</text>
  <text x="1210" y="392" class="subtitle">A ligação entre calendário e formulário fica visível aqui.</text>

  <text x="1210" y="440" class="label">Colaborador</text>
  <rect x="1210" y="452" width="190" height="42" rx="12" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="1226" y="479" class="small">Conceição Nunes</text>

  <text x="1210" y="530" class="label">Data de início</text>
  <rect x="1210" y="542" width="90" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1228" y="569" class="small">05/05</text>

  <text x="1310" y="530" class="label">Data de fim</text>
  <rect x="1310" y="542" width="90" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1328" y="569" class="small">07/05</text>

  <text x="1210" y="620" class="label">Tipo de ausência</text>
  <rect x="1210" y="632" width="190" height="42" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1226" y="659" class="small">Férias / Compensação</text>

  <text x="1210" y="708" class="label">Resumo</text>
  <rect x="1210" y="722" width="190" height="100" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1230" y="754" class="cardTitle">Totais: 3</text>
  <text x="1230" y="780" class="cardMeta">Úteis: 2</text>
  <text x="1230" y="804" class="cardMeta">Feriados: 1</text>

  <rect x="1210" y="844" width="190" height="52" rx="16" fill="url(#active)"/>
  <text x="1252" y="877" class="btnText">Submeter pedido</text>
</svg>
