[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gestao-ferias"
version = "0.2.0"
description = "Aplicação de gestão de férias - backend e demo"
authors = [ { name = "Nuno Santos" } ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "psycopg[binary]>=3.2.0",
    "psycopg_pool>=3.2.0",
]

[project.urls]
"Homepage" = "https://example.com"

[tool.setuptools]
packages = ["vacation_app"]
